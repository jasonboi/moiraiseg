name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-checks:
    name: Python 3.11 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight test dependencies
        run: python -m pip install Pillow

      - name: Run loader tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q moiraiseg.py moiraiseg_gui.py app scripts tests

      - name: Check the CLI entry point
        run: python moiraiseg.py --help
